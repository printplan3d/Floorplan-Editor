<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- Outer body -->
  <rect x="20" y="20" width="360" height="360" rx="6" fill="none" stroke="currentColor" stroke-width="8"/>
  <!-- Control panel top strip -->
  <rect x="20" y="20" width="360" height="50" fill="currentColor" opacity="0.85"/>
  <!-- Door inner panel -->
  <rect x="55" y="100" width="290" height="245" rx="6" fill="none" stroke="currentColor" stroke-width="5"/>
  <!-- Handle -->
  <rect x="160" y="115" width="80" height="14" rx="4" fill="currentColor"/>
  <!-- Rack dots -->
  <circle cx="130" cy="200" r="6" fill="currentColor"/>
  <circle cx="200" cy="200" r="6" fill="currentColor"/>
  <circle cx="270" cy="200" r="6" fill="currentColor"/>
  <circle cx="130" cy="270" r="6" fill="currentColor"/>
  <circle cx="200" cy="270" r="6" fill="currentColor"/>
  <circle cx="270" cy="270" r="6" fill="currentColor"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400">
  <!-- Countertop outline -->
  <rect x="20" y="20" width="660" height="360" rx="14" fill="none" stroke="currentColor" stroke-width="8"/>
  <!-- Inner edge showing counter thickness -->
  <rect x="45" y="45" width="610" height="310" rx="8" fill="none" stroke="currentColor" stroke-width="3"/>
  <!-- Sink basin -->
  <rect x="100" y="110" width="180" height="180" rx="14" fill="none" stroke="currentColor" stroke-width="5"/>
  <circle cx="190" cy="200" r="10" fill="currentColor"/>
  <!-- Cooktop with 4 burners -->
  <rect x="380" y="110" width="220" height="180" rx="10" fill="none" stroke="currentColor" stroke-width="5"/>
  <circle cx="430" cy="160" r="22" fill="none" stroke="currentColor" stroke-width="4"/>
  <circle cx="550" cy="160" r="22" fill="none" stroke="currentColor" stroke-width="4"/>
  <circle cx="430" cy="240" r="22" fill="none" stroke="currentColor" stroke-width="4"/>
  <circle cx="550" cy="240" r="22" fill="none" stroke="currentColor" stroke-width="4"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <!-- U-shape: two parallel flights + landing at top -->
  <rect x="20" y="20" width="260" height="560" fill="none" stroke="currentColor" stroke-width="8"/>
  <rect x="320" y="20" width="260" height="560" fill="none" stroke="currentColor" stroke-width="8"/>
  <!-- Landing connector at top -->
  <line x1="280" y1="20" x2="320" y2="20" stroke="currentColor" stroke-width="8"/>
  <line x1="280" y1="120" x2="320" y2="120" stroke="currentColor" stroke-width="8"/>
  <path d="M 20 120 L 580 120" fill="none" stroke="currentColor" stroke-width="6"/>
  <!-- Left flight risers (going up) -->
  <line x1="20" y1="200" x2="280" y2="200" stroke="currentColor" stroke-width="4"/>
  <line x1="20" y1="280" x2="280" y2="280" stroke="currentColor" stroke-width="4"/>
  <line x1="20" y1="360" x2="280" y2="360" stroke="currentColor" stroke-width="4"/>
  <line x1="20" y1="440" x2="280" y2="440" stroke="currentColor" stroke-width="4"/>
  <line x1="20" y1="520" x2="280" y2="520" stroke="currentColor" stroke-width="4"/>
  <!-- Right flight risers -->
  <line x1="320" y1="200" x2="580" y2="200" stroke="currentColor" stroke-width="4"/>
  <line x1="320" y1="280" x2="580" y2="280" stroke="currentColor" stroke-width="4"/>
  <line x1="320" y1="360" x2="580" y2="360" stroke="currentColor" stroke-width="4"/>
  <line x1="320" y1="440" x2="580" y2="440" stroke="currentColor" stroke-width="4"/>
  <line x1="320" y1="520" x2="580" y2="520" stroke="currentColor" stroke-width="4"/>
  <!-- Up arrow on left flight -->
  <path d="M 150 570 L 150 200 M 130 220 L 150 200 L 170 220" fill="none" stroke="currentColor" stroke-width="4"/>
</svg>

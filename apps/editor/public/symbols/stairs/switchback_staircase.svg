<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <!-- Outer outline (two flights side by side with landing) -->
  <rect x="20" y="20" width="560" height="560" fill="none" stroke="currentColor" stroke-width="8"/>
  <!-- Center divider wall between the two flights -->
  <line x1="300" y1="120" x2="300" y2="580" stroke="currentColor" stroke-width="6"/>
  <!-- Landing line at top -->
  <line x1="20" y1="120" x2="580" y2="120" stroke="currentColor" stroke-width="6"/>
  <!-- Left flight risers (going up) -->
  <line x1="20" y1="200" x2="300" y2="200" stroke="currentColor" stroke-width="4"/>
  <line x1="20" y1="280" x2="300" y2="280" stroke="currentColor" stroke-width="4"/>
  <line x1="20" y1="360" x2="300" y2="360" stroke="currentColor" stroke-width="4"/>
  <line x1="20" y1="440" x2="300" y2="440" stroke="currentColor" stroke-width="4"/>
  <line x1="20" y1="520" x2="300" y2="520" stroke="currentColor" stroke-width="4"/>
  <!-- Right flight risers (coming down from landing) -->
  <line x1="300" y1="200" x2="580" y2="200" stroke="currentColor" stroke-width="4"/>
  <line x1="300" y1="280" x2="580" y2="280" stroke="currentColor" stroke-width="4"/>
  <line x1="300" y1="360" x2="580" y2="360" stroke="currentColor" stroke-width="4"/>
  <line x1="300" y1="440" x2="580" y2="440" stroke="currentColor" stroke-width="4"/>
  <line x1="300" y1="520" x2="580" y2="520" stroke="currentColor" stroke-width="4"/>
  <!-- Up arrow on left flight -->
  <path d="M 160 560 L 160 170 M 140 190 L 160 170 L 180 190" fill="none" stroke="currentColor" stroke-width="4"/>
</svg>

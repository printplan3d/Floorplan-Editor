<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <!-- Balcony floor area -->
  <rect x="0" y="0" width="800" height="400" fill="#f0f0f0" stroke="black" stroke-width="6"/>
  <!-- Railing (dashed outer edge) -->
  <polyline points="0,0 0,400 800,400 800,0" fill="none" stroke="black" stroke-width="8" stroke-dasharray="20,10"/>
  <!-- Wall side (solid) -->
  <line x1="0" y1="0" x2="800" y2="0" stroke="black" stroke-width="10"/>
  <!-- Diagonal hatch lines -->
  <line x1="0" y1="100" x2="100" y2="0" stroke="#c0c0c0" stroke-width="2"/>
  <line x1="0" y1="200" x2="200" y2="0" stroke="#c0c0c0" stroke-width="2"/>
  <line x1="0" y1="300" x2="300" y2="0" stroke="#c0c0c0" stroke-width="2"/>
  <line x1="0" y1="400" x2="400" y2="0" stroke="#c0c0c0" stroke-width="2"/>
  <line x1="100" y1="400" x2="500" y2="0" stroke="#c0c0c0" stroke-width="2"/>
  <line x1="200" y1="400" x2="600" y2="0" stroke="#c0c0c0" stroke-width="2"/>
  <line x1="300" y1="400" x2="700" y2="0" stroke="#c0c0c0" stroke-width="2"/>
  <line x1="400" y1="400" x2="800" y2="0" stroke="#c0c0c0" stroke-width="2"/>
  <line x1="500" y1="400" x2="800" y2="100" stroke="#c0c0c0" stroke-width="2"/>
  <line x1="600" y1="400" x2="800" y2="200" stroke="#c0c0c0" stroke-width="2"/>
  <line x1="700" y1="400" x2="800" y2="300" stroke="#c0c0c0" stroke-width="2"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500">
  <!-- Porch floor -->
  <rect x="0" y="0" width="1000" height="500" fill="#ece8e0" stroke="black" stroke-width="6"/>
  <!-- Wall side (thick) -->
  <line x1="0" y1="0" x2="1000" y2="0" stroke="black" stroke-width="10"/>
  <!-- Column posts -->
  <rect x="20" y="440" width="40" height="40" fill="#d0d0d0" stroke="black" stroke-width="4"/>
  <rect x="480" y="440" width="40" height="40" fill="#d0d0d0" stroke="black" stroke-width="4"/>
  <rect x="940" y="440" width="40" height="40" fill="#d0d0d0" stroke="black" stroke-width="4"/>
  <!-- Railing between columns -->
  <line x1="60" y1="460" x2="480" y2="460" stroke="black" stroke-width="4"/>
  <line x1="520" y1="460" x2="940" y2="460" stroke="black" stroke-width="4"/>
  <!-- Side railings -->
  <line x1="20" y1="0" x2="20" y2="460" stroke="black" stroke-width="4"/>
  <line x1="980" y1="0" x2="980" y2="460" stroke="black" stroke-width="4"/>
  <!-- Steps (bottom center) -->
  <rect x="380" y="480" width="240" height="20" fill="none" stroke="black" stroke-width="3"/>
  <rect x="360" y="500" width="280" height="0" stroke="black" stroke-width="3"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900">
  <!-- Corner shower tray: quarter-circle in corner -->
  <path d="M 0 0 L 900 0 L 900 100 A 800 800 0 0 0 100 900 L 0 900 Z" fill="#e8e8e8" stroke="black" stroke-width="8"/>
  <!-- Glass door arc -->
  <path d="M 900 100 A 800 800 0 0 0 100 900" fill="none" stroke="black" stroke-width="5" stroke-dasharray="15,10"/>
  <!-- Shower head position -->
  <circle cx="120" cy="120" r="60" fill="none" stroke="black" stroke-width="4" stroke-dasharray="12,8"/>
  <!-- Drain -->
  <circle cx="300" cy="300" r="35" fill="#d0d0d0" stroke="black" stroke-width="4"/>
  <line x1="270" y1="300" x2="330" y2="300" stroke="black" stroke-width="3"/>
  <line x1="300" y1="270" x2="300" y2="330" stroke="black" stroke-width="3"/>
</svg>

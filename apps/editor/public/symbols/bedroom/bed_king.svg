<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 700">
  <!-- Mattress frame -->
  <rect x="20" y="20" width="720" height="660" rx="20" fill="none" stroke="currentColor" stroke-width="8"/>
  <!-- Headboard -->
  <rect x="20" y="20" width="720" height="60" fill="currentColor" opacity="0.85"/>
  <!-- Two pillows -->
  <rect x="70" y="100" width="290" height="110" rx="14" fill="none" stroke="currentColor" stroke-width="6"/>
  <rect x="400" y="100" width="290" height="110" rx="14" fill="none" stroke="currentColor" stroke-width="6"/>
  <!-- Blanket fold -->
  <line x1="20" y1="290" x2="740" y2="290" stroke="currentColor" stroke-width="5" stroke-dasharray="14 10"/>
  <!-- Center seam -->
  <line x1="380" y1="290" x2="380" y2="680" stroke="currentColor" stroke-width="3" stroke-dasharray="6 8"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 700">
  <!-- Mattress frame -->
  <rect x="20" y="20" width="360" height="660" rx="20" fill="none" stroke="currentColor" stroke-width="8"/>
  <!-- Headboard -->
  <rect x="20" y="20" width="360" height="60" fill="currentColor" opacity="0.85"/>
  <!-- Pillow -->
  <rect x="60" y="100" width="280" height="100" rx="14" fill="none" stroke="currentColor" stroke-width="6"/>
  <!-- Blanket fold line -->
  <line x1="20" y1="280" x2="380" y2="280" stroke="currentColor" stroke-width="5" stroke-dasharray="14 10"/>
</svg>
